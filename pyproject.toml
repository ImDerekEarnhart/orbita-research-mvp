[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbita-research-mvp"
version = "0.2.1"
description = "Local research-intake, governed discovery, epistemic memory, dependency collapse, and reporting service."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Derek Earnhart"}]
license = {text = "MIT"}
dependencies = [
  "jsonschema>=4.22,<5",
  "fastapi>=0.110,<1",
  "uvicorn>=0.23,<1",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
orbita-mvp = "orbita_mvp.cli:main"
orbita-research-api = "orbita_mvp.api:main"
orbita-runtime = "orbita.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["orbita*", "orbita_discovery*", "orbita_mvp*"]

[tool.setuptools.package-data]
orbita = ["schemas/*.json", "ui_assets/*.html", "ui_assets/*.js", "ui_assets/*.css"]
orbita_mvp = ["static/*.html"]
